
name: Minecraft Plugin CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Detect Java and Gradle versions
      - name: Detect Build Versions
        id: versions
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import os
          from pathlib import Path

          files = [
              Path("build.gradle"),
              Path("build.gradle.kts")
          ]

          content = "\n".join(
              p.read_text(errors="ignore")
              for p in files if p.exists()
          )

          java_patterns = [
              r'JavaLanguageVersion\.of\(\s*(\d+)\s*\)',
              r'jvmToolchain\(\s*(\d+)\s*\)',
              r'VERSION_(\d+)',
              r'JavaVersion\.toVersion\(["\'](\d+)'
          ]

          java = "21"

          for pattern in java_patterns:
              match = re.search(pattern, content)
              if match:
                  java = match.group(1)
                  break

          gradle = "8.14.3"
          wrapper = Path("gradle/wrapper/gradle-wrapper.properties")

          if wrapper.exists():
              match = re.search(
                  r'gradle-(\d+(?:\.\d+)+)(?:-[^/]*)?\.zip',
                  wrapper.read_text(errors="ignore")
              )
              if match:
                  gradle = match.group(1)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"java={java}\n")
              output.write(f"gradle={gradle}\n")

          print(f"Java version: {java}")
          print(f"Gradle version: {gradle}")
          PY

      # 3. Install Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.java }}
          cache: gradle

      # 4. Install and configure Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.versions.outputs.gradle }}

      # 5. Build plugin (wrapper or installed Gradle)
      - name: Build Plugin
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean build
          else
            echo "Gradle Wrapper not found."
            echo "Using installed Gradle instead."
            gradle clean build
          fi

      # 6. Upload compiled plugin
      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Plugin
          path: |
            **/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
